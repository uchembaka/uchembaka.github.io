<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<title>Classify That Variable — Uche Mbaka</title>
<meta name="description" content="A short drill for STAT 20070: sort each variable into Nominal, Ordinal, Discrete or Continuous.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#080A0F;
    --ink-rgb:8,10,15;
    --ink-2:#0D1017;
    --haze:#E9E6DF;
    --haze-dim:#B9B6AE;
    --mute:#6A7180;
    --mute-2:#454B58;
    --line:rgba(233,230,223,.09);
    --line-2:rgba(233,230,223,.16);
    --amber:#CFA15F;
    --steel:#5C7585;
    --ok:#7E9E82;
    --ok-soft:rgba(126,158,130,.14);
    --err:#D98A72;
    --err-soft:rgba(217,138,114,.14);
    --on-accent:#080A0F;
  }
  [data-theme="light"]{
    --ink:#F3F0E9;
    --ink-rgb:243,240,233;
    --ink-2:#FBFAF5;
    --haze:#1B1C20;
    --haze-dim:#4A4C54;
    --mute:#6E727D;
    --mute-2:#9A9DA6;
    --line:rgba(20,21,26,.10);
    --line-2:rgba(20,21,26,.18);
    --amber:#9E6B22;
    --steel:#4A6377;
    --ok:#3F6B4F;
    --ok-soft:rgba(63,107,79,.10);
    --err:#B3442E;
    --err-soft:rgba(179,68,46,.10);
    --on-accent:#FBFAF5;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--ink);
    color:var(--haze);
    font-family:"Newsreader",Georgia,serif;
    font-weight:300;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:44px 22px 72px;
    transition:background .35s ease, color .35s ease;
  }
  ::selection{background:rgba(207,161,95,.22);color:var(--haze)}
  a{color:inherit;text-decoration:none}

  .stage{width:100%;max-width:620px}

  .mono{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-weight:400;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mute);
  }

  /* ---------- top row ---------- */
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:34px}
  .back{transition:color .25s}
  .back:hover{color:var(--amber)}

  .theme-toggle{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font:inherit;line-height:1}
  .theme-toggle .tmode{color:var(--mute);transition:color .25s}
  .theme-toggle:hover .tmode{color:var(--amber)}
  .theme-toggle .track{width:40px;height:21px;border-radius:999px;border:1px solid var(--line-2);position:relative;transition:border-color .25s;flex:0 0 auto}
  .theme-toggle:hover .track{border-color:var(--amber)}
  .theme-toggle .knob{position:absolute;top:50%;left:3px;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--mute);transition:left .28s cubic-bezier(.4,0,.2,1),background .25s}
  [data-theme="light"] .theme-toggle .knob{left:22px;background:var(--amber)}
  .theme-toggle:focus-visible{outline:none}
  .theme-toggle:focus-visible .track{outline:2px solid var(--amber);outline-offset:3px}

  /* ---------- header ---------- */
  header{margin-bottom:30px}
  .eyebrow{
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mute-2);margin:0 0 16px;
  }
  h1{
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:500;
    font-size:clamp(32px,6vw,46px);line-height:1.02;letter-spacing:-.025em;
    color:var(--haze);margin:0 0 16px;
  }
  .sub{font-size:17px;line-height:1.6;color:var(--haze-dim);font-weight:300;margin:0 0 30px;max-width:46ch}
  .sub b{color:var(--amber);font-weight:400}

  /* ---------- tally ---------- */
  .tally{display:flex;gap:5px}
  .tick{flex:1;height:3px;border-radius:2px;background:var(--line-2);transition:background .25s ease}
  .tick.current{background:var(--haze-dim)}
  .tick.correct{background:var(--ok)}
  .tick.incorrect{background:var(--err)}
  .tally-label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:12px 0 0}

  /* ---------- card ---------- */
  .card{
    margin-top:26px;
    background:linear-gradient(160deg, var(--ink-2), rgba(var(--ink-rgb),0));
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 30px 28px;
  }
  @media (max-width:480px){.card{padding:26px 22px 24px}}

  .prompt{
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:400;
    font-size:clamp(20px,3.4vw,25px);line-height:1.32;letter-spacing:-.015em;
    color:var(--haze);margin:0 0 26px;
  }

  /* ---------- options ---------- */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.options{grid-template-columns:1fr}}

  .option{
    text-align:left;
    padding:15px 16px;
    background:transparent;
    border:1px solid var(--line-2);
    border-radius:10px;
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-weight:400;font-size:15.5px;letter-spacing:-.005em;
    color:var(--haze);
    cursor:pointer;
    transition:border-color .25s ease, color .25s ease, background .25s ease, opacity .25s ease;
  }
  .option:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  .option:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .option:disabled{cursor:default}
  .option.is-correct{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .option.is-wrong{background:var(--err-soft);border-color:var(--err);color:var(--err)}
  .option.is-muted{opacity:.35}

  /* ---------- hint ---------- */
  .hint-row{margin:18px 0 0;min-height:22px}
  .hint-btn{
    background:none;border:0;padding:0;cursor:pointer;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mute);
    border-bottom:1px solid var(--line-2);transition:color .25s,border-color .25s;
  }
  .hint-btn:hover{color:var(--amber);border-color:var(--amber)}
  .hint-btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}
  .hint-text{font-size:16px;line-height:1.55;color:var(--haze-dim);font-style:italic;margin:0}

  /* ---------- feedback ---------- */
  .feedback{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:none}
  .feedback.shown{display:block}
  .verdict{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px}
  .verdict.correct{color:var(--ok)}
  .verdict.wrong{color:var(--err)}
  .explanation{font-size:16.5px;line-height:1.62;color:var(--haze-dim);font-weight:300;margin:0 0 22px}

  .btn{
    display:inline-block;background:none;cursor:pointer;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--haze);
    border:1px solid var(--line-2);border-radius:999px;padding:11px 22px;
    transition:.25s;
  }
  .btn:hover{border-color:var(--amber);color:var(--amber)}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .btn.primary{border-color:var(--amber);color:var(--amber)}
  .btn.primary:hover{background:var(--amber);color:var(--on-accent)}

  /* ---------- results ---------- */
  .results .score{
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:500;
    font-size:clamp(28px,5vw,38px);line-height:1.05;letter-spacing:-.025em;
    color:var(--haze);margin:0 0 10px;
  }
  .results .score b{color:var(--amber);font-weight:500}
  .score-line{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 28px}

  .breakdown-row{display:grid;grid-template-columns:104px 1fr 48px;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
  .breakdown-row:first-of-type{border-top:none}
  .breakdown-label{font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;font-weight:400;color:var(--haze)}
  .breakdown-bar-track{background:var(--line-2);border-radius:2px;height:4px;overflow:hidden}
  .breakdown-bar-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .5s ease}
  .breakdown-count{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--mute);text-align:right}
  @media (max-width:480px){.breakdown-row{grid-template-columns:88px 1fr 44px;gap:10px}}

  .result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}

  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="stage">

  <div class="toprow">
    <a class="back mono" href="../STAT20070.html">← STAT 20070</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark theme" aria-pressed="false"><span class="tmode mono" id="tmode">Dark</span><span class="track"><span class="knob"></span></span></button>
  </div>

  <header>
    <p class="eyebrow">Section 1 · Lecture 02 · Types of Data</p>
    <h1>Classify That<br>Variable</h1>
    <p class="sub">Sort each variable into <b>Nominal</b>, <b>Ordinal</b>, <b>Discrete</b> or <b>Continuous</b>. Ten questions, an explanation after each.</p>
    <div class="tally" id="tally"></div>
    <p class="tally-label" id="tallyLabel"></p>
  </header>

  <div class="card" id="card"></div>
</div>

<script>
/* ---------- theme toggle (shares the site's stored preference) ---------- */
(function(){
  var root = document.documentElement;
  var btn  = document.getElementById('themeToggle');
  function current(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function sync(){
    var t = current();
    btn.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
    document.getElementById('tmode').textContent = t === 'light' ? 'Light' : 'Dark';
  }
  sync();
  btn.addEventListener('click', function(){
    var t = current() === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', t);
    try{ localStorage.setItem('theme', t); }catch(e){}
    sync();
  });
})();

const QUESTIONS = [
  {
    prompt: "Hair colour (Black, Brown, Blond, Red, Other)",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 0,
    hint: "Is there a natural order to the categories?",
    explanation: "Hair colour is categorical with no natural ordering — Black isn't ‘more’ or ‘less’ than Brown — so it's nominal."
  },
  {
    prompt: "Pain level following surgery (None, Mild, Moderate, Severe)",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 1,
    hint: "The categories run from lowest to highest.",
    explanation: "These categories have a clear natural ordering (None < Mild < Moderate < Severe), which makes this ordinal rather than nominal."
  },
  {
    prompt: "Number of hospital visits in a year",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 2,
    hint: "You can only visit the hospital a whole number of times.",
    explanation: "This comes from counting, and can only take distinct separate values (0, 1, 2, …), so it's discrete numerical data."
  },
  {
    prompt: "Height of an adult (in cm)",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 3,
    hint: "Could someone be 172.3564 cm tall, in principle?",
    explanation: "Height comes from measurement and can, in principle, take any value within a range — that's the hallmark of continuous data."
  },
  {
    prompt: "Alzheimer status (Yes / No)",
    options: ["Nominal (binary)", "Ordinal", "Discrete", "Continuous"],
    correct: 0,
    hint: "Only two categories, and no ranking between them.",
    explanation: "A categorical variable with exactly two unordered levels is a binary variable — a special case of nominal."
  },
  {
    prompt: "Number of petals on a flower",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 2,
    hint: "Flowers don't have fractional petals.",
    explanation: "Petals are counted, giving distinct separate integer values — classic discrete data."
  },
  {
    prompt: "Drug concentration in the blood (mg/L)",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 3,
    hint: "This comes from a lab measurement, not a count.",
    explanation: "Concentration is measured and can take any value in a range, so it's continuous."
  },
  {
    prompt: "Highest education level completed (Primary, Secondary, Tertiary)",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 1,
    hint: "Tertiary education comes ‘after’ secondary, which comes ‘after’ primary.",
    explanation: "These levels have a clear natural progression from lower to higher education, making this ordinal."
  },
  {
    prompt: "Nationality of a survey respondent",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 0,
    hint: "There's no meaningful order between, say, Irish and French.",
    explanation: "Nationality is a label with no natural ordering among categories, so it's nominal."
  },
  {
    prompt: "Reaction time to a stimulus (in seconds)",
    options: ["Nominal", "Ordinal", "Discrete", "Continuous"],
    correct: 3,
    hint: "Timing devices can measure to arbitrarily fine precision.",
    explanation: "Reaction time is measured and can take any value within a range (e.g. 0.312s, 0.3121s, …), so it's continuous."
  }
];

const CATEGORY_LABELS = ["Nominal", "Ordinal", "Discrete", "Continuous"];

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // null | true | false

const cardEl = document.getElementById('card');
const tallyEl = document.getElementById('tally');
const tallyLabelEl = document.getElementById('tallyLabel');

function renderTally() {
  tallyEl.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const t = document.createElement('div');
    t.className = 'tick';
    if (answers[i] === true) t.className += ' correct';
    else if (answers[i] === false) t.className += ' incorrect';
    else if (i === current && current < QUESTIONS.length) t.className += ' current';
    tallyEl.appendChild(t);
  });
  const correctSoFar = answers.filter(a => a === true).length;
  tallyLabelEl.textContent = current < QUESTIONS.length
    ? `Question ${current + 1} of ${QUESTIONS.length} · ${correctSoFar} correct so far`
    : `Complete · ${correctSoFar} of ${QUESTIONS.length} correct`;
}

function renderQuestion() {
  const q = QUESTIONS[current];

  cardEl.innerHTML = `
    <p class="prompt">${q.prompt}</p>
    <div class="options" id="options"></div>
    <div class="hint-row" id="hintRow">
      <button class="hint-btn" id="hintBtn" type="button">Need a hint?</button>
    </div>
    <div class="feedback" id="feedback">
      <p class="verdict" id="verdict"></p>
      <p class="explanation" id="explanation"></p>
      <button class="btn primary" id="nextBtn" type="button"></button>
    </div>
  `;

  const optionsEl = document.getElementById('options');
  q.options.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = text;
    btn.addEventListener('click', () => selectAnswer(i));
    optionsEl.appendChild(btn);
  });

  document.getElementById('hintBtn').addEventListener('click', () => {
    document.getElementById('hintRow').innerHTML =
      `<p class="hint-text">${q.hint}</p>`;
  });

  renderTally();
}

function selectAnswer(choiceIndex) {
  const q = QUESTIONS[current];
  const isCorrect = choiceIndex === q.correct;
  answers[current] = isCorrect;

  const optionButtons = document.querySelectorAll('#options .option');
  optionButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('is-correct');
    else if (i === choiceIndex) btn.classList.add('is-wrong');
    else btn.classList.add('is-muted');
  });

  document.getElementById('hintRow').style.display = 'none';

  const verdictEl = document.getElementById('verdict');
  verdictEl.textContent = isCorrect ? 'Correct' : 'Not quite';
  verdictEl.className = 'verdict ' + (isCorrect ? 'correct' : 'wrong');

  document.getElementById('explanation').textContent = q.explanation;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'See results →' : 'Next question →';
  nextBtn.addEventListener('click', () => {
    current += 1;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      renderResults();
    }
  });

  document.getElementById('feedback').classList.add('shown');
  renderTally();
}

function renderResults() {
  const totalCorrect = answers.filter(a => a === true).length;

  // breakdown by category
  const byCategory = {};
  CATEGORY_LABELS.forEach(label => byCategory[label] = { attempted: 0, correct: 0 });
  QUESTIONS.forEach((q, i) => {
    const label = CATEGORY_LABELS[q.correct];
    byCategory[label].attempted += 1;
    if (answers[i] === true) byCategory[label].correct += 1;
  });

  let breakdownHTML = '';
  CATEGORY_LABELS.forEach(label => {
    const { attempted, correct } = byCategory[label];
    const pct = attempted ? Math.round((correct / attempted) * 100) : 0;
    breakdownHTML += `
      <div class="breakdown-row">
        <span class="breakdown-label">${label}</span>
        <div class="breakdown-bar-track">
          <div class="breakdown-bar-fill" style="width:${pct}%"></div>
        </div>
        <span class="breakdown-count">${correct}/${attempted}</span>
      </div>
    `;
  });

  cardEl.innerHTML = `
    <div class="results">
      <p class="score">You scored <b>${totalCorrect}</b> out of ${QUESTIONS.length}</p>
      <p class="score-line">Correct by type, out of how many appeared</p>
      ${breakdownHTML}
      <div class="result-actions">
        <button class="btn primary" id="restartBtn" type="button">Try again</button>
        <a class="btn" href="../STAT20070.html">More drills</a>
      </div>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    renderQuestion();
  });

  renderTally();
}

renderQuestion();
</script>

</body>
</html>
